<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Placeholder icon for the unified Create Operation picker (prototype).
       Full rollout replaces this with a designed glyph. -->
  <defs>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8bd9"/>
      <stop offset="100%" stop-color="#355a9a"/>
    </linearGradient>
  </defs>
  <!-- Simple rectangular tool-body glyph -->
  <rect x="10" y="12" width="30" height="36" rx="3" ry="3"
        fill="url(#tip)" stroke="#1e3a6b" stroke-width="2"/>
  <!-- Cutting tip notches -->
  <polygon points="10,48 25,56 40,48" fill="#355a9a" stroke="#1e3a6b" stroke-width="2"/>
  <!-- Plus badge (indicates "create new") -->
  <circle cx="48" cy="48" r="12" fill="#3aa65a" stroke="#1e5e2e" stroke-width="2"/>
  <line x1="48" y1="41" x2="48" y2="55" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="41" y1="48" x2="55" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
